<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Please Tag Me｜回饋小卡片</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Noto+Serif+TC:wght@500;700;900&display=swap"
    rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      width: 100vw;
      min-height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding-top: 30px;
      padding-bottom: 30px;
      background:
        radial-gradient(circle at center, rgba(120, 60, 45, 0.28), transparent 38%),
        linear-gradient(180deg, #1a1111 0%, #070707 100%);
      color: #f4e4c1;
      font-family: "Noto Serif TC", serif;
    }

    h1 {
      margin: 0 0 18px;
      font-size: 28px;
      letter-spacing: 5px;
      font-weight: 900;
      font-family: "Cormorant Garamond", "Noto Serif TC", serif;
    }

    .card-scene {
      width: 78vw;
      height: 60vh;
      max-width: 340px;
      max-height: 500px;
      perspective: 1000px;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      position: relative;
    }

    .card {
      width: 100%;
      height: 100%;
      position: relative;
    }

    .card-face {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      border-radius: 22px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, .45);

      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;

      transition:
        transform .65s cubic-bezier(.25, .8, .25, 1),
        opacity .18s ease;

      will-change: transform, opacity;
    }

    .card-front {
      z-index: 2;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, .22), transparent 45%),
        #d8c9b2;
      display: flex;
      justify-content: center;
      align-items: center;

      transform: rotateY(0deg);
      -webkit-transform: rotateY(0deg);
      opacity: 1;
    }

    .card-back {
      z-index: 1;
      background: #e7d9c4;
      color: #3a1f1f;
      padding: 18px;

      transform: rotateY(180deg);
      -webkit-transform: rotateY(180deg);
      opacity: 0;
    }

    .card.flipped .card-front {
      transform: rotateY(-180deg);
      -webkit-transform: rotateY(-180deg);
      opacity: 0;
    }

    .card.flipped .card-back {
      transform: rotateY(0deg);
      -webkit-transform: rotateY(0deg);
      opacity: 1;
      z-index: 3;
    }

    .card-front::before {
      content: "PLEASE TAG ME";
      position: absolute;
      top: 22px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 3px;
      color: #5a2b2b;
      font-family: "Cormorant Garamond", serif;
      z-index: 2;
      white-space: nowrap;
    }

    .card-front img {
      width: 90%;
      object-fit: contain;
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);

      pointer-events: none;
      -webkit-user-drag: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .card-tags {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      max-width: 84%;
      font-size: 15px;
      font-weight: bold;
      background: rgba(255, 255, 255, .92);
      color: #5a3b4a;
      padding: 8px 16px;
      border-radius: 999px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      z-index: 3;
    }

    .back-content {
      width: 100%;
      height: 100%;
      border-radius: 18px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, .65), rgba(255, 255, 255, .25)),
        #f8f1e6;
      padding: 22px 22px 20px;
      display: flex;
      flex-direction: column;
      text-align: left;
      position: relative;
    }

    .back-content::after {
      position: absolute;
      right: -14px;
      top: 120px;
      transform: rotate(90deg);
      font-size: 42px;
      font-weight: 700;
      letter-spacing: 5px;
      color: rgba(143, 47, 47, .08);
      font-family: "Cormorant Garamond", serif;
      pointer-events: none;
    }

    .serial-number {
      font-size: 11px;
      letter-spacing: 2px;
      color: rgba(80, 40, 40, .45);
      margin-bottom: 18px;
      font-family: "Cormorant Garamond", serif;
    }

    .back-small-title {
      font-size: 12px;
      letter-spacing: 4px;
      font-weight: 700;
      color: #8f2f2f;
      font-family: "Cormorant Garamond", serif;
      margin-bottom: 12px;
    }

    .back-tags {
      align-self: flex-start;
      max-width: 100%;
      padding: 8px 14px;
      border-radius: 999px;
      background: #8f2f2f;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .feedback-text {
      width: 100%;
      color: #2b1212;
      font-size: 20px;
      line-height: 1.8;
      font-weight: 900;
      letter-spacing: 1px;
      text-align: left;
      white-space: pre-line;
      position: relative;
      padding-bottom: 20px;
      z-index: 2;
    }

    .feedback-text::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 1px;
      background: rgba(80, 40, 40, .18);
    }

    .back-note {
      margin-top: 14px;
      font-size: 11px;
      line-height: 1.7;
      letter-spacing: .5px;
      color: rgba(43, 18, 18, .55);
      font-weight: 700;
      z-index: 2;
    }

    .back-footer {
      margin-top: auto;
      align-self: flex-end;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 3px;
      color: rgba(143, 47, 47, .55);
      font-family: "Cormorant Garamond", serif;
      font-style: italic;
      z-index: 2;
    }

    .hint {
      margin-top: 14px;
      color: #ddd;
      font-size: 13px;
    }

    #downloadCard {
      position: fixed;
      left: -9999px;
      top: 0;
      width: 420px;
      height: 620px;
      padding: 24px;
      background:
        radial-gradient(circle at center, rgba(120, 60, 45, 0.28), transparent 38%),
        linear-gradient(180deg, #1a1111 0%, #070707 100%);
    }

    .download-inner {
      width: 100%;
      height: 100%;
      border-radius: 28px;
      overflow: hidden;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, .25), transparent 40%),
        #e7d9c4;
      box-shadow: 0 20px 50px rgba(0, 0, 0, .45);
      padding: 26px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .download-title {
      font-family: "Cormorant Garamond", serif;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 4px;
      color: #5a2b2b;
      margin-bottom: 18px;
    }

    #downloadImage {
      width: 62%;
      max-height: 210px;
      object-fit: contain;
      margin-bottom: 18px;
    }

    .download-tags {
      max-width: 100%;
      padding: 8px 16px;
      border-radius: 999px;
      background: #8f2f2f;
      color: white;
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 18px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .download-date {
      align-self: flex-start;
      font-family: "Cormorant Garamond", serif;
      font-size: 12px;
      letter-spacing: 2px;
      color: rgba(80, 40, 40, .45);
      margin-bottom: 16px;
    }

    .download-feedback {
      width: 100%;
      color: #2b1212;
      font-size: 22px;
      line-height: 1.8;
      font-weight: 900;
      letter-spacing: 1px;
      white-space: pre-line;
      text-align: left;
      padding-bottom: 18px;
      border-bottom: 1px solid rgba(80, 40, 40, .18);
    }

    .download-note {
      margin-top: 16px;
      align-self: flex-start;
      font-size: 12px;
      line-height: 1.7;
      color: rgba(43, 18, 18, .55);
      font-weight: 700;
    }

    .download-footer {
      margin-top: auto;
      align-self: flex-end;
      font-family: "Cormorant Garamond", serif;
      font-style: italic;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 3px;
      color: rgba(143, 47, 47, .55);
    }

    .card-front,
    .card-front * {
      -webkit-touch-callout: none;
    }
  </style>
</head>

<body>

  <h1>FEEDBACK CARD</h1>

  <div class="card-scene" id="cardScene">
    <div id="resultCard" class="card">

      <div class="card-face card-front" id="tagCardFront">
        <img id="characterImage" src="card_front.png" alt="角色圖片" draggable="false">
        <div id="cardTags" class="card-tags">讀取中...</div>
      </div>

      <div class="card-face card-back">
        <div class="back-content">
          <div id="dateText" class="serial-number"></div>
          <div class="back-small-title">YOUR TAGS</div>
          <div id="backTags" class="back-tags">讀取中...</div>
          <div id="feedbackText" class="feedback-text">讀取中...</div>
          <div class="back-note">
            這不是定義你的標籤，<br>
            而是一段重新看見自己的回聲。
          </div>
          <div class="back-footer">Please Tag Me</div>
        </div>
      </div>
    </div>
  </div>

  <div class="hint">點擊卡片翻面｜長按下載小卡</div>

  <div id="downloadCard">
    <div class="download-inner">
      <div class="download-title">PLEASE TAG ME</div>
      <img id="downloadImage" src="card_front.png" alt="下載角色圖" draggable="false">
      <div id="downloadFrontTags" class="download-tags">讀取中...</div>
      <div id="downloadDate" class="download-date"></div>
      <div id="downloadFeedback" class="download-feedback">讀取中...</div>
      <div class="download-note">
        這不是定義你的標籤，<br>
        而是一段重新看見自己的回聲。
      </div>
      <div class="download-footer">Please Tag Me</div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://wldvtasakcqdqtscbrnv.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_mtCH5g7GbaYbzsufbrgY1Q_uj_3JIDC";

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const cardTags = document.getElementById("cardTags");
    const backTags = document.getElementById("backTags");
    const feedbackText = document.getElementById("feedbackText");
    const dateText = document.getElementById("dateText");
    const characterImage = document.getElementById("characterImage");
    const tagCardFront = document.getElementById("tagCardFront");

    const downloadCard = document.getElementById("downloadCard");
    const downloadImage = document.getElementById("downloadImage");
    const downloadFrontTags = document.getElementById("downloadFrontTags");
    const downloadFeedback = document.getElementById("downloadFeedback");
    const downloadDate = document.getElementById("downloadDate");

    setDate();
    generateFrontStyle();
    loadSavedCharacter();
    setupCardInteraction();

    function setDate() {
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, "0");
      const day = String(now.getDate()).padStart(2, "0");

      dateText.innerText = `${year}.${month}.${day}`;
      downloadDate.innerText = dateText.innerText;
    }

    async function loadSavedCharacter() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get("id");

      if (!id) {
        showFallback("網址沒有帶 id\n請使用 ?id=資料id");
        return;
      }

      const { data, error } = await supabaseClient
        .from("saved_characters")
        .select("selected_tags")
        .eq("id", id)
        .single();

      if (error) {
        console.error("Supabase 讀取失敗：", error);
        showFallback("讀取 Supabase 失敗\n請確認 id 或 RLS 權限");
        return;
      }

      const selectedTags = normalizeTags(data.selected_tags);

      const tagText = selectedTags.length > 0
        ? selectedTags.map(tag => `#${tag}`).join(" ")
        : "#未選擇標籤";

      cardTags.innerText = tagText;
      backTags.innerText = tagText;
      downloadFrontTags.innerText = tagText;

      const coverImage = getCoverImageByFirstTag(selectedTags);
      characterImage.src = coverImage;
      downloadImage.src = coverImage;

      const feedback = await getFeedbackByTags(selectedTags);
      feedbackText.innerText = feedback;
      downloadFeedback.innerText = feedback;

      localStorage.setItem("selectedTags", JSON.stringify(selectedTags));
      localStorage.setItem("finalFeedback", feedback);
    }

    function getCoverImageByFirstTag(selectedTags) {
      const firstTag = selectedTags[0];

      const coverMap = {
        "胖": "ip/fat.png",
        "焦慮": "ip/anxious.png",
        "矮": "ip/short.png",
        "黑": "ip/black.png",
        "孤僻": "ip/lonely.png",
        "敏感": "ip/sensitive.png",
        "沒主見": "ip/indecisive.png",
        "固執": "ip/stubborn.png",
        "拖延": "ip/procrastination.png",
        "強迫症": "ip/ocd.png"
      };

      return coverMap[firstTag] || "card_front.png";
    }

    function normalizeTags(tags) {
      if (!Array.isArray(tags)) return [];

      return tags
        .map(item => {
          if (typeof item === "string") return item;

          if (typeof item === "object" && item !== null) {
            return item.name || item.tag || item.label || item.text || "";
          }

          return "";
        })
        .map(tag => String(tag).replace("#", "").trim())
        .filter(tag => tag !== "");
    }

    async function getFeedbackByTags(selectedTags) {
      try {
        const feedbackList = await loadFeedbackJson();

        const exactMatched = feedbackList.filter(item => {
          if (!Array.isArray(item.tags)) return false;

          const itemTags = item.tags.map(tag => String(tag).trim());

          return itemTags.length === selectedTags.length &&
            itemTags.every(tag => selectedTags.includes(tag));
        });

        if (exactMatched.length > 0) {
          return formatFeedbackText(randomPick(exactMatched).text);
        }

        const partialMatched = feedbackList.filter(item => {
          if (!Array.isArray(item.tags)) return false;

          return item.tags.some(tag => selectedTags.includes(String(tag).trim()));
        });

        if (partialMatched.length > 0) {
          return formatFeedbackText(randomPick(partialMatched).text);
        }

        return "你不是任何單一標籤\n你擁有比標籤更多的樣子";

      } catch (error) {
        console.error("feedback.json 讀取或比對失敗：", error);
        return "你不是任何單一標籤\n你擁有比標籤更多的樣子";
      }
    }

    async function loadFeedbackJson() {
      const paths = [
        "feedback.json",
        "json/feedback.json"
      ];

      for (const path of paths) {
        try {
          const response = await fetch(path);

          if (response.ok) {
            return await response.json();
          }
        } catch (error) {
          console.warn("讀取失敗：", path, error);
        }
      }

      throw new Error("找不到 feedback.json，請確認檔案位置");
    }

    function randomPick(list) {
      return list[Math.floor(Math.random() * list.length)];
    }

    function formatFeedbackText(text) {
      if (!text) {
        return "你不是任何單一標籤\n你擁有比標籤更多的樣子";
      }

      return String(text)
        .replaceAll("，", "\n")
        .replaceAll("。", "\n")
        .trim();
    }

    function showFallback(message) {
      cardTags.innerText = "#未選擇標籤";
      backTags.innerText = "#未選擇標籤";
      feedbackText.innerText = message;

      downloadFrontTags.innerText = "#未選擇標籤";
      downloadFeedback.innerText = message;

      characterImage.src = "card_front.png";
      downloadImage.src = "card_front.png";
    }

    function flipCard() {
      const card = document.getElementById("resultCard");
      card.classList.toggle("flipped");
    }

    function generateFrontStyle() {
      const palette = [
        "#EEEFEB",
        "#C9B297",
        "#E9ACBB",
        "#8FBC93",
        "#FFF1B5"
      ];

      const baseColor = palette[Math.floor(Math.random() * palette.length)];
      tagCardFront.style.backgroundColor = baseColor;
    }

    function setupCardInteraction() {
      const target = document.getElementById("cardScene");

      let pressTimer = null;
      let isLongPress = false;

      target.addEventListener("click", function () {
        if (isLongPress) {
          isLongPress = false;
          return;
        }

        flipCard();
      });

      target.addEventListener("touchstart", startLongPress, { passive: true });
      target.addEventListener("mousedown", startLongPress);

      target.addEventListener("touchend", cancelLongPress);
      target.addEventListener("mouseup", cancelLongPress);
      target.addEventListener("mouseleave", cancelLongPress);
      target.addEventListener("touchmove", cancelLongPress);

      function startLongPress() {
        isLongPress = false;
        clearTimeout(pressTimer);

        pressTimer = setTimeout(() => {
          isLongPress = true;
          downloadCardImage();
        }, 850);
      }

      function cancelLongPress() {
        clearTimeout(pressTimer);
      }
    }

    async function downloadCardImage() {
      await waitForImage(downloadImage);

      const canvas = await html2canvas(downloadCard, {
        backgroundColor: null,
        scale: 3,
        useCORS: true
      });

      const link = document.createElement("a");
      link.download = "please-tag-me-card.png";
      link.href = canvas.toDataURL("image/png");
      link.click();
    }

    function waitForImage(img) {
      return new Promise(resolve => {
        if (img.complete) {
          resolve();
        } else {
          img.onload = resolve;
          img.onerror = resolve;
        }
      });
    }
  </script>

</body>

</html>
